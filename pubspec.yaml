name: chatorai
description: "ChatORAI - AI Chat Application"
publish_to: "none"

version: 0.1.1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  flutter_riverpod: ^3.3.1
  flutter_spinkit: ^5.2.2
  flutter_markdown_plus: ^1.0.5
  flutter_highlight: ^0.7.0
  # `highlight` is now a direct dependency because `_SelectableHighlightView`
  # (`code_block.dart`) uses `highlight.parse` directly after we removed the
  # `flutter_highlight` widget layer (it produced a non-selectable `RichText`).
  highlight: ^0.7.0
  markdown: ^7.2.2
  speech_to_text: ^7.3.0
  image_picker: ^1.1.2
  dio: ^5.9.0
  shared_preferences: ^2.5.4
  path: ^1.9.1
  connectivity_plus: ^7.0.0
  share_plus: ^10.1.4
  flutter_dotenv: ^6.0.0
  file_picker: ^10.3.10
  permission_handler: ^12.0.1
  package_info_plus: ^9.0.0
  ai_sdk_dart: ^1.2.0
  ai_sdk_openai: ^1.1.0
  ai_sdk_provider: ^1.1.0
  ai_sdk_anthropic: ^1.1.0
  ai_sdk_google: ^1.1.0
  retry: ^3.1.2
  flutter_secure_storage: ^10.3.1
  html: ^0.15.6
  glob: ^2.1.2
  json_schema: ^5.2.2
  collection: ^1.19.1
  equatable: ^2.0.0
  flutter_svg: ^2.0.10+1
  command_shield: ^1.1.0
  ddgs: ^0.3.2
  http: ^1.2.0
  yaml: ^3.1.3
  drift: ^2.25.1
  sqlite3_flutter_libs: ^0.5.0
  path_provider: ^2.0.0
  uuid: ^4.5.1
  cryptography: ^2.9.0
  cryptography_flutter: ^2.3.4
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0
  mcp_dart: ^2.2.2
  synchronized: ^3.1.0
  nocterm: ^0.8.0
  dartdiff: ^1.0.0
  pdf_graphics: ^1.0.0
  pdf_document: ^1.4.7
  pdfrx: ^2.4.7
  pdfrx_engine: ^0.4.6
  archive: ^4.0.9
  xml: ^6.6.1
  image: ^4.8.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  test: ^1.26.3
  mocktail: ^1.0.3
  flutter_launcher_icons: ^0.14.1
  drift_dev: ^2.25.1
  build_runner: ^2.4.0
  json_serializable: ^6.14.0
  freezed: 3.2.6-dev.1

