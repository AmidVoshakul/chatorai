name: chatorai
description: "ChatORAI - AI Chat Application"
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  
  # Internationalization
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  
  # State Management
  provider: ^6.1.5+1
  
  # UI and Animation
  animated_text_kit: ^4.3.0
  shimmer: ^3.0.0
  flutter_animate: ^4.5.2
  flutter_spinkit: ^5.2.2
  
  # Markdown and Code Highlighting
  flutter_markdown_plus: ^1.0.5
  flutter_streaming_text_markdown: ^1.3.2
  syntax_highlight: ^0.5.0
  flutter_highlight: ^0.7.0
  markdown: ^7.2.2

  
  # Speech to Text
  speech_to_text: ^7.3.0
  
  # Camera and Image Picker
  image_picker: ^1.1.2
  
  # HTTP and Networking
  dio: ^5.9.0
  
  # Local Storage
  shared_preferences: ^2.5.4
  hive: ^2.2.3
  path: ^1.9.1
  
  # Utilities
  uuid: ^4.5.2
  clipboard: ^3.0.8
  logger: ^2.6.2
  connectivity_plus: ^7.0.0
  
  # Platform Detection
  # platform_detect: ^1.1.0
  
  # Environment Variables
  flutter_dotenv: ^6.0.0

  # Responsive Design
  responsive_framework: ^1.5.1
  intl_utils: ^2.8.13

  # Local AI Models (Android only)
  file_picker: ^10.3.8
  path_provider: ^2.1.3
  
  # Hugging Face API and Downloads
  archive: ^4.0.7
  
  # Platform detection
  platform: ^3.1.4
  
  # Permissions
  permission_handler: ^12.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  test: ^1.26.3
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - .env
    - assets/chatorai_logo.png
    - screenshots/

# Flutter Launcher Icons configuration
flutter_launcher_icons:
  image_path: "assets/chatorai_logo.png"
  android: true
  ios: true
  adaptive_icon_background: "#1a1a1a"
  adaptive_icon_foreground: "assets/chatorai_logo.png"
  #  - assets/icons/
  #  - assets/images/

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package

  generate: true
