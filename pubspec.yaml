name: chatorai
description: "ChatORAI - AI Chat Application"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  
  # Internationalization
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  
  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1
  
  # UI and Animation
  animated_text_kit: ^4.3.0
  shimmer: ^3.0.0
  flutter_animate: ^4.5.2
  flutter_spinkit: ^5.2.2
  
  # Markdown and Code Highlighting
  flutter_markdown_plus: ^1.0.5
  flutter_streaming_text_markdown: ^1.3.2
  syntax_highlight: ^0.5.0
  flutter_highlight: ^0.7.0
  markdown: ^7.2.2

  
  # Speech to Text
  speech_to_text: ^7.3.0
  
  # Camera and Image Picker
  image_picker: ^1.1.2
  
  # HTTP and Networking
  dio: ^5.9.0
  
  # Local Storage
  shared_preferences: ^2.5.4
  hive: ^2.2.3
  path: ^1.9.1
  
  # Utilities
  uuid: ^4.5.2
  clipboard: ^3.0.8
  logger: ^2.6.2
  connectivity_plus: ^7.0.0

  # Environment Variables
  flutter_dotenv: ^6.0.0

  # Responsive Design
  responsive_framework: ^1.5.1
  intl_utils: ^2.8.13

  # Local AI Models (Android only)
  file_picker: ^8.1.2
  path_provider: ^2.1.3
  
  # Hugging Face API and Downloads
  archive: ^3.4.10
  
  # Platform detection
  platform: ^3.1.4
  
  # Permissions
  permission_handler: ^11.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  test: ^1.26.3
  flutter_launcher_icons: ^0.14.1
  mockito: ^5.4.4
  build_runner: ^2.4.8

flutter:
  uses-material-design: true
  generate: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - .env
    - assets/chatorai_logo_black.png

# Localization configuration
l10n:
  arb-dir: lib/l10n
  template-arb-file: app_en.arb
  output-localization-file: app_localizations.dart
  output-class: AppLocalizations
  nullable-getter: false

# Flutter Launcher Icons configuration
flutter_launcher_icons:
  image_path: "assets/chatorai_logo_black.png"
  android: true
  ios: true
  adaptive_icon_background: "#1a1a1a"
  adaptive_icon_foreground: "assets/chatorai_logo_black.png"
  generate: true